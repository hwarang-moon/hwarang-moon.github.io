<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>웹사이트 자료실 | Hwarang Moon</title>
<style>
  :root{
    --gold:#b8860b; --ink:#1f2430; --paper:#faf8f4; --line:#e6e1d8; --muted:#6b6459;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Georgia,serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.65;
  }
  .wrap{max-width:680px;margin:0 auto;padding:64px 24px 80px;}
  header{margin-bottom:40px;border-bottom:1px solid var(--line);padding-bottom:32px;}
  .eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;}
  h1{font-size:28px;font-weight:700;margin-bottom:6px;}
  .back{font-size:13.5px;color:var(--muted);text-decoration:none;}
  .back:hover{color:var(--gold);}
  section{margin-bottom:36px;}
  .empty{
    background:#fff;border:1px dashed var(--line);border-radius:10px;
    padding:40px 24px;text-align:center;color:var(--muted);font-size:14.5px;
  }
  footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">&larr; 홈으로</a>
    <div class="eyebrow" style="margin-top:14px;">Website Archive</div>
    <h1>웹사이트 자료실</h1>
  </header>

  <section>
    <div class="empty">
      준비 중입니다. 곧 관련 웹사이트·링크 모음이 업데이트될 예정입니다.
    </div>
  </section>

  <footer>
    Korea Theological Seminary (Kosin University) · Cheonan, South Korea
  </footer>
</div>
</body>
</html>
